name: smart-machine-health
services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    ports:
      - "${MQTT_BIND_ADDRESS:-127.0.0.1}:${MQTT_PORT:-1884}:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
  influxdb:
    image: influxdb:2.7
    ports:
      - "127.0.0.1:${INFLUX_PORT:-8087}:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:?Set INFLUX_PASSWORD in .env}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:?Set INFLUX_TOKEN in .env}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-smart-machine}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-vibration}
    volumes:
      - influxdb-data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
  grafana:
    image: grafana/grafana:11.0.0
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3011}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env}
      INFLUX_TOKEN: ${INFLUX_TOKEN:?Set INFLUX_TOKEN in .env}
      INFLUX_ORG: ${INFLUX_ORG:-smart-machine}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-vibration}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      influxdb:
        condition: service_healthy
volumes:
  influxdb-data:
  grafana-data:
